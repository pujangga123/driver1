<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phaser 3 Car Game - Acceleration & Gamepad</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            flex-direction: column;
            overflow: hidden;
        }
        canvas {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            border: 1px solid #333;
        }
        .instructions {
            margin-top: 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            max-width: 600px;
        }
        .instructions span {
            color: #4fc3f7;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-container"></div>
    <div class="instructions">
        Drive with <span>Arrow Keys</span> / <span>WASD</span> or connect a <span>Gamepad</span> <br> 
        <small style="color: #aaa;">Supports analog stick and D-pad. Notice the smooth acceleration, drag, and rotation.</small>
    </div>

    <script>
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game-container',
            input: {
                gamepad: true // Enable gamepad support plugin
            },
            physics: {
                default: 'arcade',
                arcade: {
                    debug: false 
                }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);

        // Global variables for our scene
        let player;
        let cursors;
        let wasdKeys;
        let targetRotation = 0;

        // Physics constants
        const MAX_VELOCITY = 350;
        const ACCELERATION = 1200;
        const DRAG = 800;
        const ROTATION_SPEED = 0.12;
        const GAMEPAD_DEADZONE = 0.15; // Ignore slight analog stick drifts

        function preload() {
            // No external assets required. Everything is drawn procedurally.
        }

        function create() {
            // 1. Draw a background grid to help visualize movement and speed
            const bgGraphics = this.add.graphics();
            bgGraphics.lineStyle(1, 0x222222, 1);
            for (let x = 0; x <= 800; x += 50) {
                bgGraphics.moveTo(x, 0);
                bgGraphics.lineTo(x, 600);
            }
            for (let y = 0; y <= 600; y += 50) {
                bgGraphics.moveTo(0, y);
                bgGraphics.lineTo(800, y);
            }
            bgGraphics.strokePath();

            // 2. Generate the car texture programmatically
            const carGraphics = this.add.graphics();
            
            // Tires
            carGraphics.fillStyle(0x000000, 1);
            carGraphics.fillRect(2, 12, 6, 14);  // Top Left
            carGraphics.fillRect(32, 12, 6, 14); // Top Right
            carGraphics.fillRect(2, 38, 6, 14);  // Bottom Left
            carGraphics.fillRect(32, 38, 6, 14); // Bottom Right
            
            // Main Body (Blue/Cyan styling)
            carGraphics.fillStyle(0x0277bd, 1); // Darker blue edge
            carGraphics.fillRoundedRect(6, 4, 28, 56, 6);
            carGraphics.fillStyle(0x29b6f6, 1); // Lighter blue center
            carGraphics.fillRoundedRect(8, 6, 24, 52, 4);
            
            // Windshield
            carGraphics.fillStyle(0x111111, 0.9);
            carGraphics.fillRoundedRect(9, 16, 22, 10, 3);
            
            // Rear window
            carGraphics.fillStyle(0x111111, 0.9);
            carGraphics.fillRoundedRect(10, 42, 20, 8, 2);
            
            // Headlights
            carGraphics.fillStyle(0xffeb3b, 1);
            carGraphics.fillRoundedRect(9, 4, 7, 4, 2);
            carGraphics.fillRoundedRect(24, 4, 7, 4, 2);
            
            // Taillights
            carGraphics.fillStyle(0xd32f2f, 1);
            carGraphics.fillRect(9, 56, 6, 3);
            carGraphics.fillRect(25, 56, 6, 3);

            // Bake into a texture and clear graphics
            carGraphics.generateTexture('car-texture', 40, 64);
            carGraphics.destroy();

            // 3. Create Player Sprite and setup Physics
            player = this.physics.add.sprite(400, 300, 'car-texture');
            player.setCollideWorldBounds(true);
            player.body.setSize(30, 54);
            
            // Apply advanced physics properties
            player.setMaxVelocity(MAX_VELOCITY); 
            player.setDrag(DRAG);

            // 4. Setup Input mappings
            cursors = this.input.keyboard.createCursorKeys();
            wasdKeys = this.input.keyboard.addKeys({
                up: Phaser.Input.Keyboard.KeyCodes.W,
                down: Phaser.Input.Keyboard.KeyCodes.S,
                left: Phaser.Input.Keyboard.KeyCodes.A,
                right: Phaser.Input.Keyboard.KeyCodes.D
            });
        }

        function update() {
            let inputX = 0;
            let inputY = 0;

            // --- Read Keyboard Input ---
            if (cursors.left.isDown || wasdKeys.left.isDown) inputX -= 1;
            if (cursors.right.isDown || wasdKeys.right.isDown) inputX += 1;
            if (cursors.up.isDown || wasdKeys.up.isDown) inputY -= 1;
            if (cursors.down.isDown || wasdKeys.down.isDown) inputY += 1;

            // --- Read Gamepad Input ---
            if (this.input.gamepad.total > 0) {
                const pad = this.input.gamepad.getPad(0);
                
                // Read Analog Stick
                if (pad.axes.length) {
                    const axisH = pad.axes[0].getValue();
                    const axisV = pad.axes[1].getValue();
                    
                    if (Math.abs(axisH) > GAMEPAD_DEADZONE) inputX += axisH;
                    if (Math.abs(axisV) > GAMEPAD_DEADZONE) inputY += axisV;
                }
                
                // Read D-Pad (treated as boolean/digital inputs)
                if (pad.left) inputX -= 1;
                if (pad.right) inputX += 1;
                if (pad.up) inputY -= 1;
                if (pad.down) inputY += 1;
            }

            // Clamp values so we don't go super fast if pressing both keyboard and gamepad
            inputX = Phaser.Math.Clamp(inputX, -1, 1);
            inputY = Phaser.Math.Clamp(inputY, -1, 1);

            if (Math.abs(inputX) > 0 || Math.abs(inputY) > 0) {
                // We have input. Use a vector to handle analog partial inputs and normalization
                let accelVector = new Phaser.Math.Vector2(inputX, inputY);
                
                // Normalize if it exceeds 1 (like pressing digital diagonal keys)
                if (accelVector.length() > 1) {
                    accelVector.normalize();
                }
                
                player.setAcceleration(accelVector.x * ACCELERATION, accelVector.y * ACCELERATION);
            } else {
                // No input. Turn off acceleration. The 'drag' smoothly decelerates the car.
                player.setAcceleration(0, 0);
            }

            // Update rotation based on movement direction
            if (player.body.velocity.lengthSq() > 10) {
                // Add Math.PI / 2 (90 degrees) because Phaser angle 0 points Right, but our car points Up
                targetRotation = player.body.velocity.angle() + Math.PI / 2;
            }

            // Smoothly rotate the sprite
            player.rotation = Phaser.Math.Angle.RotateTo(player.rotation, targetRotation, ROTATION_SPEED);
        }
    </script>
</body>
</html>
